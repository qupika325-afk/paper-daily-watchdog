name: Daily paper delivery watchdog

# 每天 08:20 UTC 检查目标仓库的 "Send emails daily" 今天到底跑没跑：
#   - 没跑 / 跑了但失败 -> 用 DISPATCH_TOKEN 触发一次 workflow_dispatch 兜底
#   - 已经在跑 / 已成功 -> 跳过
# 本仓库不是 fork，且每天都有一次自提交，用来躲开 GitHub "公开仓库 60 天无活动即丢弃 schedule 触发" 的规则。

on:
  workflow_dispatch:
  schedule:
    - cron: "20 8 * * *"

permissions:
  contents: write

concurrency:
  group: watchdog

jobs:
  watchdog:
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: qupika325-afk/zotero-arxiv-daily
      WORKFLOW_FILE: main.yml
      TARGET_REF: main
      API: https://api.github.com
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check today's delivery
        id: check
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "::error::仓库 Secret DISPATCH_TOKEN 还没配置，兜底无法工作"
            exit 1
          fi
          today="$(date -u +%Y-%m-%d)"
          url="$API/repos/$TARGET_REPO/actions/workflows/$WORKFLOW_FILE/runs?per_page=50&created=%3E%3D${today}T00:00:00Z"
          json="$(curl -fsSL -H "Authorization: Bearer $DISPATCH_TOKEN" \
                        -H "Accept: application/vnd.github+json" "$url")"
          echo "$json" | jq -r '.workflow_runs[] | [.run_number, .event, .status, .conclusion // "-"] | @tsv'
          active=$(echo "$json" | jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress")] | length')
          ok=$(echo "$json" | jq '[.workflow_runs[] | select(.conclusion=="success")] | length')
          echo "today=$today active=$active ok=$ok"
          if [ "$active" -gt 0 ] || [ "$ok" -gt 0 ]; then
            echo "verdict=skip" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=dispatch" >> "$GITHUB_OUTPUT"
          fi

      - name: Fallback dispatch
        if: steps.check.outputs.verdict == 'dispatch'
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"ref\":\"$TARGET_REF\"}" \
            "$API/repos/$TARGET_REPO/actions/workflows/$WORKFLOW_FILE/dispatches")"
          echo "dispatch http=$code"
          if [ "$code" != "204" ]; then
            echo "::error::兜底触发失败 http=$code（token 过期 / scope 不是 Actions:write / 仓库名不对）"
            exit 1
          fi

      - name: Verify the run actually got queued
        if: steps.check.outputs.verdict == 'dispatch'
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          sleep 25
          url="$API/repos/$TARGET_REPO/actions/workflows/$WORKFLOW_FILE/runs?event=workflow_dispatch&per_page=1"
          latest="$(curl -fsSL -H "Authorization: Bearer $DISPATCH_TOKEN" \
                          -H "Accept: application/vnd.github+json" "$url")"
          echo "$latest" | jq -r '.workflow_runs[0] | "now: \(.run_number) \(.status) \(.html_url)"'
          created="$(echo "$latest" | jq -r '.workflow_runs[0].created_at')"
          today="$(date -u +%Y-%m-%d)"
          case "$created" in
            "$today"*) echo "ok: 今天的新 run 已入队" ;;
            *) echo "::error::dispatch 后没看到今天的新 run（看到 $created），请检查 token 权限"; exit 1 ;;
          esac

      - name: Record heartbeat (keeps this repo active)
        if: always()
        env:
          VERDICT: ${{ steps.check.outputs.verdict }}
        run: |
          set -euo pipefail
          echo "$(date -u +'%Y-%m-%d %H:%M:%S UTC') verdict=${VERDICT:-not-run} target=$TARGET_REPO" > state/last-check.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/last-check.txt
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -q -m "chore: watchdog heartbeat [skip ci]"
            timeout 60 git push -q
          fi
